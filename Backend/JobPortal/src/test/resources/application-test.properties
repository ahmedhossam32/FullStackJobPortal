# Test-only configuration, activated via @ActiveProfiles("test") on JobPortalApplicationTests.
# No real secrets — values below are fake and only need to satisfy @Value bindings so the
# Spring context can start under test. The datasource itself is provided at runtime by
# Testcontainers (see JobPortalApplicationTests), so no spring.datasource.* properties are
# set here.

spring.jpa.hibernate.ddl-auto=create-drop

jwt.secret=test-only-jwt-signing-secret-not-for-production-use-0123456789
jwt.expiration=3600000

cloudinary.cloud-name=test-cloud
cloudinary.api-key=test-api-key
cloudinary.api-secret=test-api-secret

spring.mail.host=localhost
spring.mail.port=3025
app.email.from=test@example.com
app.email.name=JobPortal Test
